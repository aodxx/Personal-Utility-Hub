<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3f5bd8" />
    <title>ออฟไลน์ · Personal Utility Hub</title>
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.25rem; background: #f5f7fb; color: #121a2b; }
      main { max-width: 34rem; padding: 2rem; border: 1px solid #dce2ec; border-radius: 1.25rem; background: #fff; box-shadow: 0 16px 48px rgb(24 35 74 / 10%); }
      span { color: #3f5bd8; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .75rem 0; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; }
      p { color: #5b667a; line-height: 1.7; }
      a { display: inline-flex; margin-top: .75rem; padding: .75rem 1rem; border-radius: .65rem; background: #3f5bd8; color: #fff; font-weight: 750; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { background: #0d1526; color: #f5f7fb; } main { border-color: #2d3b53; background: #141f34; } p { color: #aeb9cd; } }
    </style>
  </head>
  <body>
    <main>
      <span>Offline fallback</span>
      <h1>ขณะนี้ไม่มีอินเทอร์เน็ต</h1>
      <p>หน้าและเครื่องมือที่เคยโหลดไว้ยังอาจใช้งานได้ ลองกลับไปหน้า Hub หรือเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชอีกครั้ง</p>
      <a href="./#/">กลับหน้า Hub</a>
    </main>
  </body>
</html>
